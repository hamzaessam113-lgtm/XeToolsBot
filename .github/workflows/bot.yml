name: Run Telegram Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f XeToolsBot/requirements.txt ]; then pip install -r XeToolsBot/requirements.txt; fi

      - name: Run bot
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f XeToolsBot/main.py ]; then
            python XeToolsBot/main.py
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
