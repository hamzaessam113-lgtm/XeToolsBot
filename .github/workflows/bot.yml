import os
import telebot

# جلب التوكن من المتغيرات البيئية
TOKEN = os.getenv('TELEGRAM_TOKEN')
bot = telebot.TeleBot(TOKEN)

# رسالة الترحيب
@bot.message_handler(commands=['start', 'help'])
def send_welcome(message):
    bot.reply_to(message, "أهلاً بك! أرسل لي أي صورة وسأقوم بالرد عليك.")

# استقبال الصور
@bot.message_handler(content_types=['photo'])
def handle_photo(message):
    bot.reply_to(message, "تم استلام الصورة بنجاح! جاري معالجتها...")
    # تقدر تضيف هنا الكود الخاص بمعالجة الصورة أو الذكاء الاصطناعي

# استقبال النصوص العادية
@bot.message_handler(func=lambda message: True)
def handle_all_messages(message):
    bot.reply_to(message, f"أهلاً بك يا صديقي، وصلتني رسالتك: {message.text}")

if __name__ == '__main__':
    print("Bot is running...")
    bot.infinity_polling()
